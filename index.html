<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>语言0障碍</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="语言0障碍">
<meta name="theme-color" content="#0d1014">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#0d1014; --panel:#161a21; --panel2:#1e242d; --line:#2a313c;
  --text:#f3f1ea; --dim:#8f98a6; --accent:#ffb347; --accent-ink:#1b1204;
  --me:#2b6f5e; --me-ink:#e9fff8; --danger:#ff6b5e; --ok:#58d39b;
  --fs:22px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;padding-top:var(--sat)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
header{display:flex;align-items:center;gap:10px;padding:10px 14px 8px}
.brand{font-weight:800;letter-spacing:.02em;font-size:17px}
.brand b{color:var(--accent)}
.status{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:#4a5261}
.dot.on{background:var(--ok);box-shadow:0 0 0 4px rgba(88,211,155,.18)}
.dot.wait{background:var(--accent);animation:blink 1s infinite}
.dot.err{background:var(--danger)}
@keyframes blink{50%{opacity:.3}}
.icon-btn{width:38px;height:38px;border-radius:12px;background:var(--panel);display:grid;place-items:center;font-size:18px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin:0 14px 8px;padding:4px;background:var(--panel);border-radius:14px}
.tab{padding:8px 2px;border-radius:10px;font-weight:700;font-size:14px;color:var(--dim)}
.tab small{font-size:10px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-weight:500;font-size:11px;opacity:.8;margin-top:1px}
.tab.sel{background:var(--accent);color:var(--accent-ink)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 14px 16px}
.seg{margin:0 0 14px;max-width:100%}
.seg .tr{font-size:var(--fs);line-height:1.45;font-weight:650;word-break:break-word}
.seg .src{font-size:calc(var(--fs)*.62);line-height:1.5;color:var(--dim);margin-top:3px;word-break:break-word}
.seg .nf{opacity:.55}
.seg.echo{opacity:.35}
.seg.echo .tr{font-size:calc(var(--fs)*.6)}
.ai .ja{font-size:var(--fs);line-height:1.6;font-weight:650;word-break:break-word}
.ai .ja rt{font-size:.5em;font-weight:500;color:var(--accent)}
.ai .zh{font-size:calc(var(--fs)*.62);line-height:1.5;color:var(--dim);margin-top:4px}
.ai .fix{margin-top:8px;padding:8px 10px;border-radius:10px;background:#3a2a10;color:#ffd79a;font-size:calc(var(--fs)*.6);line-height:1.5}
body.hide-zh .ai .zh{display:none}
.typing{display:inline-block;color:var(--dim);animation:blink 1s infinite}
.report{position:fixed;inset:0;background:var(--bg);z-index:45;display:none;flex-direction:column;padding:calc(14px + var(--sat)) 16px calc(14px + var(--sab))}
.report .body{flex:1;overflow-y:auto;white-space:pre-wrap;line-height:1.75;font-size:16px;padding:6px 2px}
.report .bar{display:flex;gap:10px;padding-top:10px}
.report .bar button{flex:1;padding:13px;border-radius:14px;background:var(--panel2);font-weight:800}
.report .bar button.pri{background:var(--accent);color:var(--accent-ink)}
.eyeimg{max-width:100%;max-height:42vh;border-radius:12px;display:block}
.ai .say{font-weight:700;line-height:1.6;font-size:calc(var(--fs)*.8)}
.ai .detail{margin-top:8px;font-size:calc(var(--fs)*.72);line-height:1.7;white-space:pre-wrap;word-break:break-word}
.ai .detail rt,.ai .say rt{font-size:.55em;color:var(--accent);font-weight:500}
.seg .who{font-size:11px;color:var(--dim);margin-bottom:2px;letter-spacing:.04em}
body.hide-src .seg.has-tr .src{display:none}
/* 对话模式气泡 */
body.mode-talk .seg{background:var(--panel);border-radius:18px 18px 18px 6px;padding:11px 14px;width:fit-content;max-width:92%}
body.mode-talk .seg.me{margin-left:auto;background:var(--me);color:var(--me-ink);border-radius:18px 18px 6px 18px}
body.mode-talk .seg.me .src,body.mode-talk .seg.me .who{color:rgba(233,255,248,.7)}
body.mode-listen .seg{border-left:3px solid var(--line);padding-left:11px}
body.mode-listen .seg:last-child{border-left-color:var(--accent)}
.empty{color:var(--dim);font-size:15px;line-height:1.7;padding:18px 4px}
.empty h2{color:var(--text);font-size:20px;margin:0 0 8px}
.empty ol{padding-left:20px;margin:8px 0}
.empty a{color:var(--accent)}
.empty .cta{display:inline-block;margin-top:10px;padding:11px 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:800}
.toast{position:fixed;left:14px;right:14px;bottom:calc(150px + var(--sab));background:#3a1512;color:#ffd9d4;border:1px solid #6b2a24;
  padding:11px 14px;border-radius:12px;font-size:14px;line-height:1.5;display:none;z-index:30}
.toast.info{background:var(--panel2);color:var(--text);border-color:var(--line)}
footer{padding:8px 14px calc(10px + var(--sab));background:linear-gradient(180deg,transparent,var(--bg) 22%);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.side{display:flex;gap:6px}
@media (max-width:400px){ .chip{min-width:40px;padding:0 9px;font-size:13px} .go{width:78px;height:78px} }
.side.r{justify-content:flex-end}
.chip{min-width:44px;height:44px;padding:0 10px;white-space:nowrap;border-radius:14px;background:var(--panel);font-size:14px;font-weight:700;color:var(--text);display:grid;place-items:center}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.go{position:relative;width:86px;height:86px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:17px}
.go.run{background:var(--danger);color:#fff}
.ring{position:absolute;inset:0;border-radius:50%;background:var(--accent);opacity:.22;transform:scale(1);will-change:transform;pointer-events:none;z-index:-1}
.go.run .ring{background:var(--danger)}
.gowrap{position:relative;z-index:0}
.langs{display:flex;align-items:center;gap:6px;margin:0 14px 6px;font-size:13px;color:var(--dim);overflow-x:auto}
.langs span{white-space:nowrap;flex:none}
.langs button{padding:6px 12px;border-radius:999px;background:var(--panel);color:var(--text);font-weight:700;font-size:13px;white-space:nowrap}
.langs button.sel{background:var(--panel2);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.go small{display:block;font-size:10px;font-weight:700;opacity:.75;margin-top:1px}
/* 设置面板 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;background:var(--panel);border-radius:22px 22px 0 0;
  padding:16px 16px calc(20px + var(--sab));transform:translateY(105%);transition:transform .25s;z-index:41;max-width:640px;margin:0 auto}
.sheet.open{transform:none}
.sheet h3{margin:2px 0 12px;font-size:18px;display:flex;align-items:center}
.sheet h3 button{margin-left:auto;color:var(--accent);font-weight:800;font-size:15px;padding:6px 4px}
.f{margin-bottom:14px}
.f label{display:block;font-size:13px;color:var(--dim);margin-bottom:5px}
.f input[type=text],.f input[type=password],.f select,.f textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;outline:none}
.f textarea{min-height:64px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent)}
.f .hint{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.5}
.f .hint a{color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.sw small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.sw input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:20px;background:#3a4250;position:relative;flex:none;transition:.2s;margin-left:12px}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{left:23px}
.btn-line{width:100%;padding:12px;border-radius:12px;background:var(--panel2);font-weight:700;margin-top:8px}
/* 大字展示 */
.big{position:fixed;inset:0;background:#fff;color:#111;z-index:50;display:none;flex-direction:column;padding:calc(18px + var(--sat)) 22px calc(18px + var(--sab))}
.big .t{flex:1;display:grid;place-items:center;text-align:center;font-weight:800;line-height:1.35;font-size:clamp(30px,8.5vw,64px);overflow-y:auto;word-break:break-word}
.big .s{color:#777;font-size:15px;text-align:center;margin-bottom:12px}
.big .bar{display:flex;gap:10px}
.big .bar button{flex:1;padding:14px;border-radius:14px;background:#111;color:#fff;font-weight:800;font-size:16px}
.big .bar button.alt{background:#e9e9e9;color:#111}
@media (min-width:760px){
  body{max-width:860px;margin:0 auto}
  :root{--fs:26px}
}
</style>
</head>
<body class="mode-talk">
<header>
  <div class="brand">语言<b>0</b>障碍</div>
  <div class="status"><span class="dot" id="dot"></span><span id="stat">未开始</span></div>
  <button class="icon-btn" id="btnSet" aria-label="设置">⚙</button>
</header>
<div id="diag" style="display:none;margin:0 14px 6px;padding:6px 10px;border-radius:10px;background:#1a2230;color:#9fb3c8;font-size:11px;line-height:1.5;font-family:ui-monospace,Menlo,monospace"></div>
<div class="tabs">
  <button class="tab sel" data-mode="talk">面对面<small id="tabTalkSub">中文 ⇄ 日语</small></button>
  <button class="tab" data-mode="phone">打电话<small id="tabPhoneSub">另一台手机免提</small></button>
  <button class="tab" data-mode="listen">收听<small id="tabListenSub">电视 / 广播</small></button>
  <button class="tab" data-mode="coach">陪练<small id="tabCoachSub">AI 老师</small></button>
  <button class="tab" data-mode="eye">看懂<small>拍照讲解</small></button>
</div>
<div class="langs" id="langs"><span>对方语言</span></div>
<div class="langs" id="phoneTips" style="display:none"></div>
<div class="langs" id="coachBar" style="display:none"></div>
<div class="langs" id="eyeBar" style="display:none">
  <button id="eyeCam" class="sel">📷 拍照</button><button id="eyePick">🖼 相册</button><button id="eyeNew">🆕 新话题</button>
  <input type="file" id="eyeFileCam" accept="image/*" capture="environment" style="display:none">
  <input type="file" id="eyeFilePick" accept="image/*" style="display:none">
</div>
<main id="list"></main>
<div class="toast" id="toast"></div>
<form id="eyeAskBar" style="display:none;gap:8px;padding:6px 14px 0">
  <input id="eyeInput" type="text" placeholder="打字提问，或点「开始」用说的" style="flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;outline:none">
  <button type="submit" class="chip on" style="height:44px">发送</button>
</form>
<div id="resume" style="display:none;position:fixed;left:14px;right:14px;bottom:calc(120px + var(--sab));z-index:31">
  <button id="btnResume" style="width:100%;padding:16px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:17px;box-shadow:0 8px 26px rgba(0,0,0,.5)">
    🎤 点这里继续听<small id="resumeWhy" style="display:block;font-weight:600;font-size:12px;opacity:.75;margin-top:2px"></small></button>
</div>
<footer>
  <div class="side">
    <button class="chip" id="btnFsDown" aria-label="字体缩小">A−</button>
    <button class="chip" id="btnFsUp" aria-label="字体放大">A+</button>
    <button class="chip" id="btnHs" aria-label="耳机模式" style="font-size:13px">🎧</button>
  </div>
  <div class="gowrap"><span class="ring" id="ring"></span><button class="go" id="btnGo">开始<small id="goSub">点一下</small></button></div>
  <div class="side r">
    <button class="chip" id="btnTts" aria-label="朗读译文" style="font-size:14px">🔈</button>
    <button class="chip" id="btnClear" aria-label="清空">🗑</button>
  </div>
</footer>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <h3>设置 <button id="btnSetDone">完成</button></h3>
  <div class="f">
    <label>Soniox API Key（只保存在这台设备上）</label>
    <input type="password" id="inKey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="粘贴你的 API Key">
    <div class="hint">到 <a href="https://console.soniox.com" target="_blank" rel="noopener">console.soniox.com</a> 注册 → API Keys → 新建一个 Key → 复制粘贴到这里。</div>
  </div>
  <div class="row2">
    <div class="f"><label>我的语言</label><select id="selMy"></select></div>
    <div class="f"><label>对方 / 节目语言</label><select id="selOther"></select></div>
  </div>
  <div class="f" id="srcWrap">
    <label>声音来源</label>
    <select id="selSrc">
      <option value="mic">麦克风（手机 / 电脑）</option>
      <option value="tab">电脑里播放的声音（网页会议、视频，仅电脑 Chrome / Edge）</option>
    </select>
  </div>
  <label class="sw"><span>显示原文<small>译文下方显示日语原文，顺便练听力</small></span><input type="checkbox" id="swSrc"></label>
  <label class="sw"><span>对话：读我的话给对方听<small>我说中文 → 外放日语</small></span><input type="checkbox" id="swReadMe"></label>
  <label class="sw"><span>对话：读对方的话给我听<small>对方说日语 → 读中文（适合戴耳机）</small></span><input type="checkbox" id="swReadThem"></label>
  <label class="sw"><span>打电话：读我的话给对方听<small>我说中文 → 这台手机外放日语</small></span><input type="checkbox" id="swReadPhone"></label>
  <label class="sw"><span>收听：边听边读中文<small>广播、电视、会议同声传译</small></span><input type="checkbox" id="swReadListen"></label>
  <label class="sw"><span>耳机模式 🎧<small>戴耳机时打开：朗读时不暂停收听</small></span><input type="checkbox" id="swHs"></label>
  <div class="row2" style="margin-top:8px">
    <div class="f"><label>朗读语速</label><select id="selRate"><option value="1">正常</option><option value="1.15">稍快</option><option value="1.3">快</option><option value="1.5">很快</option></select></div>
    <div class="f"><label>麦克风</label><select id="selMic"><option value="">默认</option></select></div>
  </div>
  <div class="f" style="margin-top:-6px"><div class="hint">戴蓝牙耳机收听电视/广播时，建议麦克风选「iPhone 麦克风」，否则会用耳机上的麦克风收音。</div></div>
  <div class="row2" style="margin-top:6px">
    <div class="f"><label>朗读声音</label><select id="selVoiceSrc"><option value="soniox">自然人声（推荐）</option><option value="sys">手机系统声音</option></select></div>
    <div class="f"><label>人声音色</label><select id="selVoice"></select></div>
  </div>
  <div class="f" style="margin-top:-6px"><div class="hint">iPhone 没声音时：检查手机侧面静音开关、调大媒体音量。朗读时会暂停收音，读完自动继续。</div></div>
  <h3 style="margin:18px 0 10px;font-size:16px;border-top:1px solid var(--line);padding-top:14px">🤖 AI 陪练</h3>
  <div class="row2">
    <div class="f"><label>AI 老师（随时可换）</label><select id="selAi">
      <option value="openai">OpenAI</option><option value="qwen">千问</option><option value="claude">Claude</option><option value="doubao">豆包</option></select></div>
    <div class="f"><label>模型</label><input type="text" id="inAiModel" autocapitalize="off" spellcheck="false"></div>
  </div>
  <div class="f"><label id="lbAiKey">API Key</label>
    <input type="password" id="inAiKey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="粘贴这家 AI 的 Key">
    <div class="hint" id="aiHint"></div></div>
  <div class="f"><label>「看懂」用的看图模型</label><input type="text" id="inAiVision" autocapitalize="off" spellcheck="false">
    <div class="hint">留空 = 用默认值。千问要用视觉模型（如 qwen3-vl-plus）；OpenAI、Claude 一般和上面相同即可。</div></div>
  <div class="f" id="qwenRegWrap"><label>千问 Key 所属地域</label><select id="selQwenReg"><option value="cn">中国（北京）</option><option value="intl">国际（新加坡）</option></select></div>
  <div class="row2">
    <div class="f"><label>纠错方式</label><select id="selFix"><option value="end">说完再纠（练完看报告）</option><option value="instant">边说边纠（每句提示）</option></select></div>
    <div class="f"><label>AI 语速</label><select id="selCoachRate"><option value="0.85">慢</option><option value="1">正常</option><option value="1.15">稍快</option></select></div>
  </div>
  <div class="f"><label>自定义场景（可选）</label><textarea id="inScene" placeholder="例：我是公司社长，打电话给物流公司确认明天的集货时间"></textarea></div>
  <div class="f"><label>自定义接口地址（一般留空）</label><input type="text" id="inAiUrl" autocapitalize="off" spellcheck="false" placeholder="留空 = 用官方地址"></div>
  <button class="btn-line" id="btnAiTest">测试 AI 连接</button>
  <div class="hint" id="aiTestOut" style="margin-top:6px;font-size:13px;line-height:1.6"></div>
  <h3 style="margin:18px 0 10px;font-size:16px;border-top:1px solid var(--line);padding-top:14px">🎙 收音与朗读</h3>
  <label class="sw"><span>小声增强<small>自动放大小声音（电视、远处说话），建议开启</small></span><input type="checkbox" id="swBoost"></label>
  <label class="sw"><span>区分说话人<small>会议时标出 说话人1、2、3…</small></span><input type="checkbox" id="swSpk"></label>
  <label class="sw"><span>屏幕常亮<small>使用中不自动锁屏</small></span><input type="checkbox" id="swWake"></label>
  <div class="f" style="margin-top:12px">
    <label>专有词汇（可选，逗号分隔）</label>
    <textarea id="inTerms" placeholder="例：川原株式会社, 荒川区, 天猫国际"></textarea>
    <div class="hint">写上公司名、人名、商品名，识别和翻译会更准。</div>
  </div>
  <div class="f">
    <label>模型（一般不用改）</label>
    <input type="text" id="inModel" autocapitalize="off" spellcheck="false">
  </div>
  <label class="sw"><span>显示诊断信息<small>出问题时打开，截图发给开发者</small></span><input type="checkbox" id="swDiag"></label>
  <button class="btn-line" id="btnCopy">复制全部记录</button>
  <div class="hint" style="text-align:center;color:var(--dim);font-size:12px;margin-top:12px">版本 2.4</div>
</div>

<div class="report" id="report">
  <h3 style="margin:0 0 6px;font-size:19px">📝 练习报告</h3>
  <div class="body" id="reportBody"></div>
  <div class="bar"><button id="repCopy">复制</button><button class="pri" id="repClose">关闭</button></div>
</div>
<div class="big" id="big">
  <div class="s" id="bigS"></div>

var echoCount=0, echoWarned=false;

    if(!s.echo&&!s.said&&(isEcho(s.src,s.id)||isEcho(s.tr,s.id))){ s.echo=true; s.el.classList.add("echo"); echoCount++ }
    if(s.echo) continue;

    if(cutAt>0&&settled>150){ say(rest.slice(0,cutAt),lang,s.id); s.said=said+cutAt; continue }

function buildCtx(){ // 新建音频引擎（第一次必须在点击时同步执行）

/* 统一调用：流式输出，onDelta 收到文字片段 */
var aiAbort=null;
function aiCall(messages,system,opts){
  opts=opts||{};
  var prov=cfg.ai, fmt=AI[prov].fmt, key=aiKey(), model=opts.model||aiModel(), url=aiUrl();
  if(!model) return Promise.reject(new Error("请在设置里填写「模型」"));
  var ctrl=window.AbortController?new AbortController():null; if(!opts.noAbortSave) aiAbort=ctrl;
  var maxTok=opts.max||700, stream=!!opts.onDelta;
  var body, headers={"Content-Type":"application/json"};
  if(fmt==="claude"){
    headers["x-api-key"]=key; headers["anthropic-version"]="2023-06-01"; headers["anthropic-dangerous-direct-browser-access"]="true";
    body={model:model,max_tokens:maxTok,system:[{type:"text",text:system,cache_control:{type:"ephemeral"}}],messages:messages.map(toClaudeMsg),stream:stream};
  }else{
    headers["Authorization"]="Bearer "+key;
    body={model:model,messages:[{role:"system",content:system}].concat(messages),stream:stream};
    if(prov==="openai"){ body.max_completion_tokens=maxTok; if(/^gpt-5/.test(model)) body.reasoning_effort=opts.effort||"low" }
    else body.max_tokens=maxTok;
    if(prov==="qwen") body.enable_thinking=false;
  }
  var tried={}, netTries=0, gotAny="";
  function netFail(e){
    if(e&&e.name==="AbortError") throw e;
    if(gotAny) return gotAny;                 // 已经收到一部分：就用这部分，不报错
    if(netTries<2){ netTries++; if(opts.onRetry) opts.onRetry(netTries); return new Promise(function(r){ setTimeout(r,800*netTries) }).then(go) }
    throw new Error("网络没连上 "+AI[prov].name+"（"+(e&&e.message||e)+"），已重试 2 次。检查一下网络，点下面的「重试」。");
  }
  function go(){
    var t0=Date.now();
    return fetch(url,{method:"POST",headers:headers,body:JSON.stringify(body),signal:ctrl?ctrl.signal:undefined}).then(function(r){
      if(!r.ok) return r.text().then(function(t){
        // 某些模型不支持的参数：去掉后重试一次
        var drop=["reasoning_effort","enable_thinking","max_completion_tokens"].filter(function(p){return body[p]!==undefined&&!tried[p]&&t.indexOf(p)>=0})[0];
        if(r.status===400&&drop){ tried[drop]=1; if(drop==="max_completion_tokens"){ body.max_tokens=body[drop] } delete body[drop]; return go() }
        var e=new Error(aiErrText(r.status,t)); e.status=r.status; throw e;
      });
      if(!stream) return r.json().then(function(j){ return fmt==="claude"?((j.content||[]).map(function(c){return c.text||""}).join("")):((j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||"") });
      var rd=r.body.getReader(), dec=new TextDecoder(), buf="", full="";
      function pump(){
        return rd.read().then(function(x){
          if(x.done) return full;
          buf+=dec.decode(x.value,{stream:true});
          var lines=buf.split("\n"); buf=lines.pop();
          lines.forEach(function(L){
            L=L.trim(); if(L.indexOf("data:")!==0) return;
            var d=L.slice(5).trim(); if(!d||d==="[DONE]") return;
            try{
              var j=JSON.parse(d), piece="";
              if(fmt==="claude"){ if(j.type==="content_block_delta"&&j.delta&&j.delta.text) piece=j.delta.text; if(j.type==="error") throw new Error(j.error&&j.error.message) }
              else{ var c=j.choices&&j.choices[0]; piece=(c&&c.delta&&c.delta.content)||"" }
              if(piece){ if(!full) coach.firstMs=Date.now()-t0; full+=piece; gotAny=full; opts.onDelta(piece,full) }
            }catch(e){ if(e&&e.message&&!(e instanceof SyntaxError)) throw e }
          });
          return pump();
        });
      }
      return pump().catch(netFail);
    },function(e){
      if(e&&e.name==="AbortError") throw e;
      if(netTries<2) return netFail(e);
      throw new Error("连不上 "+AI[prov].name+"（"+(e&&e.message||e)+"）。可能是网络问题或浏览器跨域限制，可先点设置里的「测试 AI 连接」。");
    });
  }
  return go();
}
function toClaudeMsg(m){
  if(typeof m.content==="string") return m;
  return {role:m.role,content:m.content.map(function(p){
    if(p.type==="image_url"){ var u=p.image_url.url, mm=u.match(/^data:([^;]+);base64,(.*)$/); return {type:"image",source:{type:"base64",media_type:mm[1],data:mm[2]}} }
    return p;
  })};
}

function aiErrText(st,t){
  var m=t; try{ var j=JSON.parse(t); m=(j.error&&(j.error.message||j.error.code))||j.message||t }catch(e){}
  m=String(m).slice(0,160);
  if(st===401||st===403) return "Key 无效或没有权限（"+st+"）："+m;
  if(st===402||st===429) return "额度不足或请求太频繁（"+st+"）："+m;
  if(st===404) return "模型名或接口地址不对（404）："+m;
  return "AI 返回错误（"+st+"）："+m;
}

function coachAsk(userText,hidden){
  coach.busy=true; coach.streamDone=false;

  if(coach.hist.length>40) coach.hist=coach.hist.slice(-40);
  var el=coachBubble("ai"); el.innerHTML='<div class="ja"><span class="typing">…</span></div><div class="zh"></div>';
  coachScroll();
  var spoken=0, lastJa="";
  function parse(full){
    var lines=full.split("\n"), ja=[], zh=[], fix=[], sec="ja";
    lines.forEach(function(L){
      var m=L.match(/^\s*(ZH|FIX|中文|纠错)\s*[:：]\s*(.*)$/i);
      if(m){ sec=/^(ZH|中文)$/i.test(m[1])?"zh":"fix"; L=m[2] }
      else L=L.replace(/^\s*(JA|日本語|日语)\s*[:：]\s*/i,"");
      if(!L.trim()) return;

  }

    el.firstChild.innerHTML=rubyH(p.ja)+(done?"":' <span class="typing">…</span>');

    var re=/[。！？!?…]+["」』）)]?|[.](?=\s)/g; while((m=re.exec(rest))) cut=m.index+m[0].length;
    if(cut>0){ say(rest.slice(0,cut),cfg.other); spoken+=cut }
  }
  return aiCall(coach.hist,sysPrompt(),{max:700,onRetry:function(n){ el.firstChild.innerHTML='<span class="typing">网络不稳，正在重试（'+n+'）…</span>' },onDelta:function(piece,full){
      var p=parse(full); paint(p,false);
      if(p.ja!==lastJa){ lastJa=p.ja; if(p.inJa) speakUpTo(p.ja,false); else speakUpTo(p.ja,true) }
    }}).then(function(full){
      var p=parse(full); paint(p,true); speakUpTo(p.ja,true);
      coach.hist.push({role:"assistant",content:full});

    },function(e){
      coach.streamDone=true; coach.busy=false; coach.hist.pop();

      el.innerHTML='<div class="fix" style="background:#3a1512;color:#ffd9d4">'+escH(e&&e.message||e)+'</div>'+
        '<button class="cta" style="margin-top:8px;padding:9px 16px">🔄 重试</button>';
      el.querySelector("button").onclick=function(){ el.remove(); coach.items=coach.items.filter(function(x){return x!==el}); coachAsk(userText,hidden) };
    });
}

function shrinkImage(file){ // 压缩到最长边 1600，省流量、加快

    im.src=url;

      if(e&&e.name==="AbortError"){ el.remove(); return }
      var msg=(e&&e.message||String(e));
      if(/404|model/i.test(msg)) msg+="\n（看图模型可能不对：千问请用 qwen3-vl-plus 等视觉模型，在 ⚙ →「看懂」用的看图模型 里修改）";
      el.innerHTML='<div class="fix" style="background:#3a1512;color:#ffd9d4;white-space:pre-wrap">'+escH(msg)+'</div><button class="cta" style="margin-top:8px;padding:9px 16px">🔄 重试</button>';
      el.querySelector("button").onclick=function(){ el.remove(); eye.items=eye.items.filter(function(x){return x!==el}); eyeAsk(q,img) };
    });
}

/* 自动更新：打开或切回 App 时检查新版本，有就自动刷新（绕过手机缓存） */
var MY_VER=(document.body.innerHTML.match(/版本 (\d+\.\d+)/)||[])[1]||"", lastCheck=0;
function checkUpdate(){
  if(running||Date.now()-lastCheck<30000||!window.fetch||location.protocol.indexOf("http")!==0) return;
  lastCheck=Date.now();
  fetch("./index.html?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.text()}).then(function(t){
    var v=(t.match(/版本 (\d+\.\d+)/)||[])[1];
    if(v&&MY_VER&&v!==MY_VER){ toast("发现新版本 "+v+"，正在更新…",true,2000); setTimeout(function(){ location.replace("./index.html?v="+v) },800) }
  }).catch(function(){});
}
checkUpdate();
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") checkUpdate() });
})();
